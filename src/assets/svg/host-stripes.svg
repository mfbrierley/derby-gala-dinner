<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 510" width="500" height="510">
  <defs>
    <!-- Gold stripes running down to the right at 47 degrees, 21.2 apart. -->
    <pattern id="stripes" width="21.2" height="21.2" patternUnits="userSpaceOnUse" patternTransform="rotate(47)">
      <rect width="21.2" height="9.4" fill="#80633a"/>
    </pattern>
    <!-- Brightest behind the photo, fading to nothing in every direction, so no edge is ever cut off. -->
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="249" cy="216" r="247" gradientTransform="translate(0 216) scale(1 .862) translate(0 -216)">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#737373"/>
      <stop offset=".85" stop-color="#222"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <!-- A faint warm glow between the stripes, near the middle. -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="249" cy="216" r="150" gradientTransform="translate(0 216) scale(1 .862) translate(0 -216)">
      <stop offset="0" stop-color="#2e2a10" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2e2a10" stop-opacity="0"/>
    </radialGradient>
    <mask id="soft" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="510">
      <rect width="500" height="510" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="500" height="510" fill="url(#glow)"/>
  <rect width="500" height="510" fill="url(#stripes)" mask="url(#soft)"/>
</svg>
